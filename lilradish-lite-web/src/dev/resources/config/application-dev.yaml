# Under config/: this file is on the test classpath too, whose root must carry no application-dev.yaml.
# Prices and the characters per unit are quoted: unquoted, a decimal passes through a double on its way in.
lilradish:
  deployed:
    models:
      - name: sample_model
        modes: [research]
        sent-per-call-limit: 200000
        characters-per-unit: "4"
        came-back-per-call-limit: 8192
        prices-per-million:
          - currency: USD
            sent-per-million: "7"
            came-back-per-million: "21"
        tools:
          - name: web_search
            kind: web_search
            max-uses-per-call: 3
            prices-per-use:
              - currency: USD
                per-use: "0.01"
  development-model-calls:
    routes:
      - model: sample_model
        tools: [web_search]
        outbound: development_search
        inbound: development_search
