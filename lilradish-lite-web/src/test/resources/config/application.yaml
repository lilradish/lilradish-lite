# Under config/ so it loads beside the application's own application.yaml rather than hiding it.
# Prices and the characters per unit are quoted: unquoted, a decimal passes through a double on its way in.
lilradish:
  deployed:
    models:
      - name: sample_model
        modes: [research, careful_research]
        sent-per-call-limit: 200000
        characters-per-unit: "4"
        came-back-per-call-limit: 8192
        prices-per-million:
          - currency: USD
            sent-per-million: "7"
            came-back-per-million: "21"
          - currency: EUR
            sent-per-million: "6"
            came-back-per-million: "19"
      - name: sample_reader
        modes: [research, careful_research]
        sent-per-call-limit: 200000
        characters-per-unit: "4"
        came-back-per-call-limit: 8192
        prices-per-million:
          - currency: USD
            sent-per-million: "8"
            came-back-per-million: "23"
          - currency: EUR
            sent-per-million: "5"
            came-back-per-million: "17"
# A spec starting the whole application starts it on a copy of a database the real baseline was applied to, which
# holds no migration Flyway could find on this classpath: left on, it would refuse every one already applied.
spring:
  datasource:
    hikari:
      maximum-pool-size: 4
      minimum-idle: 0
  flyway:
    enabled: false
